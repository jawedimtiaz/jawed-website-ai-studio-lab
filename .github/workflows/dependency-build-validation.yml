name: Dependency and Build Validation

concurrency:
  group: dependency-build-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "src/**"
      - "scripts/prepare-dist.mjs"
      - ".github/workflows/dependency-build-validation.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "src/**"
      - "scripts/prepare-dist.mjs"
      - ".github/workflows/dependency-build-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-build:
    name: Frozen install, TypeScript and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned Bun
        run: npm install --global bun@1.3.5
      - name: Verify Bun version
        run: bun --version
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Run TypeScript validation
        run: bun run lint
      - name: Build production assets
        run: bun run build
      - name: Verify production output
        run: test -s dist/index.html
