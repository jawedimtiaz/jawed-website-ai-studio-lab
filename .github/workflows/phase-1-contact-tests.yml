name: Phase 1 Contact API Build and Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "functions/api/contact.js"
      - "worker.js"
      - "src/services/contactLogger.ts"
      - "migrations/**"
      - "scripts/test-contact-api.mjs"
      - "package.json"
      - "src/**"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/phase-1-contact-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-api-build-and-tests:
    name: Contact API tests, lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run contact API tests
        run: node scripts/test-contact-api.mjs
      - name: Run TypeScript lint
        run: npm run lint
      - name: Build production assets
        run: npm run build
