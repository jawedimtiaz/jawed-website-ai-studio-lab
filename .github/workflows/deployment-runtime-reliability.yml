name: Deployment Runtime Reliability Gate
concurrency:
  group: deployment-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "wrangler.jsonc"
      - "package.json"
      - "bun.lock"
      - "worker.js"
      - "src/**"
      - "scripts/prepare-dist.mjs"
      - "tsconfig.json"
      - "vite.config.ts"
      - "scripts/validate-wrangler-deployment-safety.mjs"
      - "scripts/deploy-production.mjs"
      - "scripts/create-preview-artifact-manifest.mjs"
      - "scripts/validate-preview-artifact.mjs"
      - "tests/preview-artifact-validation.test.js"
      - ".github/workflows/deploy-preview-main.yml"
      - "tests/wrangler-deployment-safety.test.js"
      - "config/deployment-runtime-contract.json"
      - "config/production-smoke-contract.json"
      - "scripts/validate-deployment-runtime-reliability.mjs"
      - "docs/cloudflare-pages-deployment.md"
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - "404.html"
      - "sitemap.xml"
      - "index.html"
      - "functions/**"
      - ".github/workflows/deployment-runtime-reliability.yml"
  push:
    branches: [main]
    paths:
      - "wrangler.jsonc"
      - "package.json"
      - "bun.lock"
      - "worker.js"
      - "src/**"
      - "scripts/prepare-dist.mjs"
      - "tsconfig.json"
      - "vite.config.ts"
      - "scripts/validate-wrangler-deployment-safety.mjs"
      - "scripts/deploy-production.mjs"
      - "tests/wrangler-deployment-safety.test.js"
      - "config/deployment-runtime-contract.json"
      - "config/production-smoke-contract.json"
      - "scripts/validate-deployment-runtime-reliability.mjs"
      - "docs/cloudflare-pages-deployment.md"
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - "404.html"
      - "sitemap.xml"
      - "index.html"
      - "functions/**"
      - ".github/workflows/deployment-runtime-reliability.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-runtime-reliability:
    name: Deployment runtime reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate Wrangler deployment environment separation
        run: node scripts/validate-wrangler-deployment-safety.mjs
      - name: Test Wrangler deployment safety guards
        run: node --test tests/wrangler-deployment-safety.test.js
      - name: Run deployment runtime reliability validation
        run: node scripts/validate-deployment-runtime-reliability.mjs

  preview-worker-dry-run:
    name: Preview Worker dry-run build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies with frozen lockfile
        run: bun install --frozen-lockfile
      - name: Build application assets
        run: bun run build
      - name: Test Worker route and API integration boundaries
        run: node --test tests/worker-integration.test.js
      - name: Test Preview artifact validation
        run: node --test tests/preview-artifact-validation.test.js
      - name: Compile Preview Worker without deploying
        run: ./node_modules/.bin/wrangler deploy --dry-run --env preview --outdir .wrangler-dry-run
      - name: Verify deployment artifact inputs
        run: |
          set -euo pipefail
          test -s worker.js
          test -s wrangler.jsonc
          test -s dist/index.html
          test -s dist/app-routes.json
      - name: Create SHA-pinned artifact manifest and checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/create-preview-artifact-manifest.mjs "$SOURCE_SHA" .
      - name: Package Preview Worker artifact for controlled deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-worker-${{ github.sha }}
          path: |
            worker.js
            wrangler.jsonc
            dist/
            preview-artifact-manifest.json
          if-no-files-found: error
          retention-days: 3
