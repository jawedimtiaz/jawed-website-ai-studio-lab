name: Manual Studio HQ Worker Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-hq-manual-worker-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy approved Studio HQ revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout approved Studio HQ revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: 7c103f61e2692b6b18eeb9249f02d18ba3ea60a6
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build application and static assets
        run: bun run build

      - name: Verify deployment target and build output
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8').replace(/^\s*\/\/.*$/gm, ''));
          if (config.name !== 'jawed-website-ai-studio-lab') throw new Error('Unexpected Worker target');
          if (config.assets?.directory !== './dist') throw new Error('Unexpected assets directory');
          for (const name of ['HQ_SESSION_LIMITER', 'HQ_WRITE_LIMITER']) {
            if (!config.ratelimits?.some(binding => binding.name === name)) throw new Error('Missing rate-limit binding: ' + name);
          }
          if (!fs.existsSync('dist/index.html')) throw new Error('Build output dist/index.html is missing');
          console.log('Deployment target, rate-limit bindings, and dist/index.html verified.');
          NODE

      - name: Deploy Studio HQ Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config wrangler.jsonc
