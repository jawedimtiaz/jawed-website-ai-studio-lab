name: Studio HQ Private Route Cache Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'service-worker.js'
      - 'scripts/test-hq-service-worker-cache.mjs'
      - '.github/workflows/studio-hq-private-route-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-route-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify private HQ routes bypass PWA cache
        run: node scripts/test-hq-service-worker-cache.mjs
