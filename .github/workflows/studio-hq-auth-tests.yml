name: Studio HQ Firebase Signature Verification Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/lib/hqAuth.js'
      - 'functions/lib/hqAuth.test.js'
      - 'package.json'
      - '.github/workflows/studio-hq-auth-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hq-auth-unit-tests:
    name: Firebase signature verification unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run HQ authentication tests
        run: node --test functions/lib/hqAuth.test.js
      - name: TypeScript lint and production build
        run: npm run build
