name: Studio HQ Firebase Auth Tests

on:
  push:
    branches:
      - feat/studio-hq-firebase-auth
      - fix/phase-2-7j-hq-auth-d1-alignment
  pull_request:
    branches:
      - main
      - feat/studio-hq-projects-api
      - fix/studio-hq-owner-status-enforcement
      - fix/studio-hq-bounded-json-body
    paths:
      - 'functions/lib/hqAuth.js'
      - 'functions/lib/hqAuth.test.js'
      - 'functions/lib/hqApi.js'
      - 'functions/lib/hqApi.test.js'
      - 'functions/api/hq/session.js'
      - 'functions/api/hq/clients.js'
      - 'functions/api/hq/clients.test.js'
      - 'functions/api/hq/clients.api.test.js'
      - 'functions/api/hq/financial.js'
      - 'functions/api/hq/financial.test.js'
      - 'migrations/hq/**'
      - 'scripts/test-hq-migration.mjs'
      - 'scripts/test-hq-service-worker-cache.mjs'
      - 'scripts/test-studio-hq-private-page.mjs'
      - 'functions/api/hq/projects.js'
      - 'functions/api/hq/projects.test.js'
      - 'worker.js'
      - 'tests/hq-owner-authorization.test.js'
      - 'package.json'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - '.github/workflows/studio-hq-auth-tests.yml'

permissions:
  contents: read

jobs:
  hq-auth-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-report.json" || true
          node --input-type=commonjs - "$RUNNER_TEMP/npm-audit-report.json" <<'NODE'
          const fs = require('node:fs');
          const reportPath = process.argv[2];
          let report;
          try {
            report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          } catch (error) {
            console.error('Dependency audit report could not be parsed:', error.message);
            process.exit(0);
          }
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Dependency audit summary:', JSON.stringify(counts));
          const vulnerabilities = Object.entries(report.vulnerabilities || {});
          if (vulnerabilities.length === 0) {
            console.log('No package-level vulnerabilities were reported.');
          }
          for (const [name, item] of vulnerabilities) {
            const via = (item.via || []).map(entry =>
              typeof entry === 'string'
                ? { name: entry }
                : {
                    name: entry.name,
                    title: entry.title,
                    url: entry.url,
                    range: entry.range,
                    severity: entry.severity,
                    cwe: entry.cwe,
                    cvss: entry.cvss
                  }
            );
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              via,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
      - name: Report resolved Firebase and gRPC dependency versions
        shell: bash
        run: |
          npm ls firebase @firebase/firestore @firebase/firestore-compat @grpc/grpc-js --all || true
      - name: Run HQ authentication tests
        run: npm run test:hq-auth
      - name: TypeScript and production build
        run: npm run build
      - name: Validate Cloudflare Worker configuration (dry run)
        run: npx wrangler deploy --dry-run
