name: Studio HQ Firebase Auth Tests

on:
  push:
    branches:
      - feat/studio-hq-firebase-auth
      - fix/phase-2-7j-hq-auth-d1-alignment
  pull_request:
    branches:
      - main
      - feat/studio-hq-projects-api
      - fix/studio-hq-owner-status-enforcement
      - fix/studio-hq-bounded-json-body
    paths:
      - 'functions/lib/hqAuth.js'
      - 'functions/lib/hqAuth.test.js'
      - 'functions/lib/hqApi.js'
      - 'functions/lib/hqApi.test.js'
      - 'functions/api/hq/session.js'
      - 'functions/api/hq/clients.js'
      - 'functions/api/hq/clients.test.js'
      - 'functions/api/hq/clients.api.test.js'
      - 'functions/api/hq/financial.js'
      - 'functions/api/hq/financial.test.js'
      - 'migrations/hq/**'
      - 'scripts/test-hq-migration.mjs'
      - 'scripts/test-hq-service-worker-cache.mjs'
      - 'scripts/test-studio-hq-private-page.mjs'
      - 'scripts/check-dependency-audit.mjs'
      - 'scripts/verify-no-grpc-runtime.mjs'
      - 'docs/ci-dependency-advisory-exception.md'
      - 'functions/api/hq/projects.js'
      - 'functions/api/hq/projects.test.js'
      - 'worker.js'
      - 'tests/hq-owner-authorization.test.js'
      - 'package.json'
      - 'bun.lock'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - '.github/workflows/studio-hq-auth-tests.yml'

permissions:
  contents: write

jobs:
  hq-auth-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Update Vite to the latest compatible patched release
        run: bun update vite --lockfile-only
      - name: Install dependencies from generated lockfile candidate
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Capture dependency audit report from committed lockfile
        shell: bash
        run: |
          bun audit --json > "$RUNNER_TEMP/bun-audit-report.json" || audit_exit=$?
          if [ ! -s "$RUNNER_TEMP/bun-audit-report.json" ]; then
            echo "bun audit did not produce a report (exit ${audit_exit:-0})."
            exit 1
          fi
          node scripts/check-dependency-audit.mjs "$RUNNER_TEMP/bun-audit-report.json"
      - name: Report resolved Firebase and gRPC dependency versions
        shell: bash
        run: |
          npm ls firebase @firebase/firestore @firebase/firestore-compat @grpc/grpc-js --all || true
      - name: Run HQ authentication tests
        run: npm run test:hq-auth
      - name: TypeScript and production build
        run: npm run build
      - name: Validate Cloudflare Worker configuration (dry run)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Verify gRPC server-auth code is absent from production artifacts
        run: node scripts/verify-no-grpc-runtime.mjs dist .wrangler-dry-run
      - name: Commit patched dependency lockfile to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp bun.lock "$RUNNER_TEMP/bun.lock"
          cp package.json "$RUNNER_TEMP/package.json"
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B lockfile-update FETCH_HEAD
          cp "$RUNNER_TEMP/bun.lock" bun.lock
          cp "$RUNNER_TEMP/package.json" package.json
          git add bun.lock package.json
          if git diff --cached --quiet; then
            echo "Committed dependency lockfile already matches the generated candidate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): update Vite to patched release"
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
