name: Studio HQ Firebase Auth Tests

on:
  push:
    branches:
      - feat/studio-hq-firebase-auth
  pull_request:
    branches:
      - main
    paths:
      - 'functions/lib/hqAuth.js'
      - 'functions/lib/hqAuth.test.js'
      - 'package.json'
      - '.github/workflows/studio-hq-auth-tests.yml'

permissions:
  contents: read

jobs:
  hq-auth-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run HQ authentication tests
        run: npm run test:hq-auth
      - name: TypeScript and production build
        run: npm run build
