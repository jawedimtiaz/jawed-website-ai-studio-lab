name = "jawed-website-ai-studio-lab"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "lab"
CANONICAL_ORIGIN = "https://lab.jawed.co.in"

[[d1_databases]]
binding = "HQ_DB"
database_name = "jawed-studio-hq"
database_id = "d9ec83ea-7114-4179-af8e-a22ba5494508"
migrations_dir = "migrations/hq"

# Studio HQ: approximate per-location abuse protection.
# Namespace IDs must be unique within this Cloudflare account.
[[ratelimits]]
name = "HQ_SESSION_LIMITER"
namespace_id = "8726111401"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "HQ_WRITE_LIMITER"
namespace_id = "8726111402"

  [ratelimits.simple]
  limit = 30
  period = 60

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
